# g0rd0n configuration.
#
# This file is the only way a path, a cap, or a reachable host enters the process. Nothing
# below the CLI reads the environment, so what is written here is what a run did. Unknown
# sections and keys are rejected rather than ignored — a mistyped cap that silently does
# nothing is the failure mode this file exists to prevent.
#
# Paths are machine-specific. Edit them; `g0rd0n doctor` will tell you what is missing.

[kernel]
# knk's storage root, and the mcp_server binary g0rd0n speaks to over stdio (Phase 2).
# g0rd0n never links, vendors, or forks the C++ kernel.
storage_root = "~/.local/share/g0rd0n/kernel"
mcp_server = "~/development/c++/knk/build/mcp_server"

[vault]
# The Obsidian vault (Phase 3). A derived projection of the kernel: rebuildable from
# scratch, never read back as fact.
root = "~/.local/share/g0rd0n/vault"

[ledger]
# The append-only record of every reservation, spend, and settlement (Phase 1). Written
# before any total is believed; the `g0rd0n cost` report is derived from it and stores
# nothing of its own.
journal = "~/.local/share/g0rd0n/ledger.jsonl"

[budget]
# The three caps from AGENTS.md, in US dollars, smallest first. They must nest.
# Exceeding one raises BudgetExhausted and settles cleanly (Phase 1).
session_usd = 5.0
campaign_usd = 50.0
standing_usd = 500.0

[network]
# The only hosts any instrument may reach (Phase 6). Primary sources first: an allowlist of
# summarisers is how a literature review turns into a game of telephone.
allowlist = [
    "api.anthropic.com",
    "arxiv.org",
    "export.arxiv.org",
    "openreview.net",
    "proceedings.mlr.press",
    "papers.nips.cc",
    "dl.acm.org",
    "ieeexplore.ieee.org",
    "doi.org",
    "api.semanticscholar.org",
    "zenodo.org",
]

[model]
# Where cells call, and what it costs (Phase 4). The endpoint's host must appear in the
# allowlist above, or the call is refused before anything is sent.
endpoint = "https://api.anthropic.com/v1/messages"

# A file containing the API key, and nothing else. A path rather than the key itself so the
# secret stays out of the repository, and a file rather than an environment variable because
# the environment is ambient state that makes two runs differ invisibly.
api_key_file = "~/.config/g0rd0n/anthropic-api-key"

# What each model costs, per million tokens. Declared here rather than compiled in: prices
# change, differ per account, and every number in `g0rd0n cost` is derived from these. A
# model with no price cannot be run — there is no default, because a guessed price is a
# number nobody chose sitting in the ledger forever.
#
# Check these against your own billing page before trusting a total.
prices = [
    { model = "claude-opus-5", input_usd_per_mtok = 15.0, output_usd_per_mtok = 75.0 },
    { model = "claude-sonnet-5", input_usd_per_mtok = 3.0, output_usd_per_mtok = 15.0 },
    { model = "claude-haiku-4-5-20251001", input_usd_per_mtok = 1.0, output_usd_per_mtok = 5.0 },
]

[human]
# Where a question for a person is dropped, and where their answer is picked up (Phase 4b).
# A directory rather than a console prompt because g0rd0n runs unattended: the question
# outlives the process that asked it, and can be answered from another machine or another
# day. Both halves stay on disk, so what was asked is auditable alongside what was answered.
queue = "~/.local/share/g0rd0n/human-queue"
